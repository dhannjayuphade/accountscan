<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="AccountScan by Dhananjay Uphade">
  <style>
    .mono { font-family: "Courier New", Courier, monospace; }
    .bar  { fill: #12201a; }
    .dim  { fill: #3c6b53; }
    .g    { fill: #00ff9c; }
    .c    { fill: #00e5ff; }
    .m    { fill: #ff2bd6; }
    .y    { fill: #ffd400; }
    .title-main { fill: #00ff9c; }
    .title-c    { fill: #00e5ff; mix-blend-mode: screen; animation: glitchA 3.2s infinite steps(1); }
    .title-m    { fill: #ff2bd6; mix-blend-mode: screen; animation: glitchB 3.2s infinite steps(1); }
    @keyframes glitchA { 0%,86%,100% { transform: translate(0,0); opacity: 0; } 87% { transform: translate(-5px,1px); opacity: .85; } 90% { transform: translate(4px,-2px); opacity: .85; } 93% { transform: translate(-2px,0); opacity: .85; } 95% { opacity: 0; } }
    @keyframes glitchB { 0%,86%,100% { transform: translate(0,0); opacity: 0; } 88% { transform: translate(5px,-1px); opacity: .85; } 91% { transform: translate(-4px,2px); opacity: .85; } 94% { transform: translate(2px,0); opacity: .85; } 96% { opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .l1 { opacity: 0; animation: fadeIn .01s linear .3s forwards; }
    .l2 { opacity: 0; animation: fadeIn .01s linear 1.0s forwards; }
    .l3 { opacity: 0; animation: fadeIn .01s linear 1.6s forwards; }
    .l4 { opacity: 0; animation: fadeIn .6s linear 2.1s forwards; }
    .l5 { opacity: 0; animation: fadeIn .6s linear 2.7s forwards; }
    .l6 { opacity: 0; animation: fadeIn .6s linear 3.2s forwards; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { animation: blink 1s infinite steps(1); }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(400px); } }
    .scanline { animation: scan 4.5s linear infinite; }
    @keyframes rain { from { transform: translateY(-120px); opacity: 0; } 10% { opacity: .55; } to { transform: translateY(380px); opacity: 0; } }
    .r1 { animation: rain 5.2s linear infinite; }
    .r2 { animation: rain 6.8s linear infinite 1.1s; }
    .r3 { animation: rain 4.6s linear infinite 2.3s; }
    .r4 { animation: rain 7.4s linear infinite .6s; }
    .r5 { animation: rain 5.9s linear infinite 3.0s; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07100c"/>
      <stop offset="1" stop-color="#03070a"/>
    </linearGradient>
    <linearGradient id="sl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="2" y="2" width="896" height="356" rx="14"/></clipPath>
  </defs>

  <rect x="2" y="2" width="896" height="356" rx="14" fill="url(#bg)" stroke="#00ff9c" stroke-opacity=".7" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <!-- falling code columns -->
    <g class="mono dim" font-size="16">
      <text class="r1" x="40"  y="0">1<tspan x="40" dy="18">0</tspan><tspan x="40" dy="18">1</tspan><tspan x="40" dy="18">1</tspan><tspan x="40" dy="18">0</tspan></text>
      <text class="r2" x="190" y="0">0<tspan x="190" dy="18">1</tspan><tspan x="190" dy="18">0</tspan><tspan x="190" dy="18">1</tspan></text>
      <text class="r3" x="710" y="0">1<tspan x="710" dy="18">1</tspan><tspan x="710" dy="18">0</tspan><tspan x="710" dy="18">1</tspan><tspan x="710" dy="18">0</tspan></text>
      <text class="r4" x="820" y="0">0<tspan x="820" dy="18">0</tspan><tspan x="820" dy="18">1</tspan></text>
      <text class="r5" x="860" y="0">1<tspan x="860" dy="18">0</tspan><tspan x="860" dy="18">1</tspan><tspan x="860" dy="18">0</tspan></text>
    </g>

    <!-- window bar -->
    <rect class="bar" x="2" y="2" width="896" height="34"/>
    <circle cx="26" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="19" r="6" fill="#27c93f"/>
    <text class="mono g" x="450" y="24" font-size="14" text-anchor="middle" opacity=".85">root@dhananjay:~/accountscan</text>

    <!-- terminal lines -->
    <g class="mono" font-size="17">
      <text class="l1 g" x="30" y="72">$ python accountscan.py --email you@gmail.com</text>
      <text class="l2 dim" x="30" y="98">[*] arming read-only mode ........ <tspan class="g">OK</tspan></text>
      <text class="l3 dim" x="30" y="122">[*] secure IMAP (SSL/TLS) ........ <tspan class="g">OK</tspan></text>
    </g>

    <!-- glitch title -->
    <g class="mono" font-size="84" font-weight="700" text-anchor="middle" letter-spacing="3">
      <text class="l4 title-main" x="450" y="212">ACCOUNTSCAN</text>
      <text class="title-c" x="450" y="212">ACCOUNTSCAN</text>
      <text class="title-m" x="450" y="212">ACCOUNTSCAN</text>
    </g>

    <text class="l5 mono c" x="450" y="250" font-size="20" text-anchor="middle">&gt;&gt; Find where YOUR email is registered</text>

    <g class="l6">
      <text class="mono m" x="450" y="294" font-size="22" font-weight="700" text-anchor="middle">Developer: Dhananjay Uphade</text>
      <text class="mono y pulse" x="450" y="324" font-size="16" text-anchor="middle">dhannjayuphade.github.io</text>
    </g>
    <rect class="cursor" x="574" y="311" width="11" height="17" fill="#00ff9c" opacity="0"/>

    <!-- moving scanline -->
    <rect class="scanline" x="2" y="0" width="896" height="40" fill="url(#sl)"/>
  </g>
</svg>
